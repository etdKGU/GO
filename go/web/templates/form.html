{{define "content"}}
<h1>Добавить трату</h1>
<form method="POST" action="/expenses/new">
    <p>
        <label>Сумма:
            <input type="number" name="amount" step="0.01">
        </label>
    </p>
    <p>
        <label>Описание:
            <input type="text" name="description">
        </label>
    </p>
    <p>
        <label>Дата:
            <input type="date" name="date">
        </label>
    </p>
    <button type="submit">Добавить</button>
</form>
{{end}}
