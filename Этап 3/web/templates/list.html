{{define "content"}}
<h1>Мои траты</h1>
<table border="1">
    <tr>
        <th>Дата</th>
        <th>Описание</th>
        <th>Сумма</th>
        <th>Действия</th>
    </tr>
    {{range .}}
    <tr>
        <td>{{.Date}}</td>
        <td>{{.Description}}</td>
        <td>{{.Amount}}</td>
        <td>
            <div class="actions">
                <form method="GET" action="/expenses/edit">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit">Изменить</button>
                </form>

                <form method="POST" action="/expenses/delete" onsubmit="return confirm('Удалить эту трату?')">
                    <input type="hidden" name="id" value="{{.ID}}">
                    <button type="submit">Удалить</button>
                </form>
            </div>
        </td>
    </tr>
    {{end}}
</table>
{{end}}
