{{define "content"}}
<h1>Изменить трату</h1>
<form method="POST" action="/expenses/edit">
    <input type="hidden" name="id" value="{{.ID}}">
    <p>
        <label>Сумма:
            <input type="number" name="amount" step="0.01" min="0.01" value="{{.Amount}}" required
                oninvalid="this.setCustomValidity('Сумма должна быть больше 0')" oninput="this.setCustomValidity('')">
        </label>
    </p>
    <p>
        <label>Описание:
            <input type="text" name="description" required maxlength="200" value="{{.Description}}" pattern=".*\S.*"
                oninvalid="this.setCustomValidity('Введите описание траты')" oninput="this.setCustomValidity('')">
        </label>
    </p>
    <p>
        <label>Дата:
            <input type="date" name="date" value="{{.Date}}" required>
        </label>
    </p>
    <button type="submit">Сохранить</button>
</form>
{{end}}
